services:
  # Redis Database (Hỗ trợ Realtime Socket.io cho WorkHub)
  redis:
    image: redis:7-alpine
    container_name: workhub_redis
    ports:
      - "6379:6379"
    restart: always

  # Backend Node (JS) - Core API & Realtime
  backend-node:
    build: ./backend-node
    container_name: workhub_node
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis

  # Frontend React
  frontend:
    build:
      context: ./frontend
      args:
        VITE_NODE_API_URL: ${VITE_NODE_API_URL:-}
        VITE_PYTHON_API_URL: ${VITE_PYTHON_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: workhub_frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-http://backend-node:5000}
      - NGINX_RESOLVER=${NGINX_RESOLVER:-127.0.0.11}
    depends_on:
      - backend-node
